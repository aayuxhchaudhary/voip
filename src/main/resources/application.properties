spring.application.name=voip
server.port=8088

# Local port
sip.local.port=5070

# Networks allowed to listen on
sip.local.bind-ip=0.0.0.0

# Reply back IP address
sip.local.contact-ip=127.0.0.1

# Debug trace level, for udp packet and status
sip.stack.trace-level=0

# Callee IP address
sip.server.host=127.0.0.1

# Callee PORT
sip.server.port=5060

# Response and exception messages
sip.message.success=SIP INVITE dispatched successfully
sip.message.error=SIP call failed
sip.message.missing-caller=Missing required parameter: caller
sip.message.missing-callee=Missing required parameter: callee
sip.exception.bind-failed=Failed to bind UDP Listening Point
sip.exception.stack-start-failed=Could not start SIP signaling stack

# Mute raw SIP packet dumps and internal NIST stack engine logs
logging.level.gov.nist.javax.sip=WARN

# Database configuration (saves recording path and call metadata)
spring.datasource.url=jdbc:mysql://localhost:3306/audio_db?createDatabaseIfNotExist=true
spring.datasource.username=aayush
spring.datasource.password=aayush@1
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Filesystem recording path (relative or absolute)
recording.storage-path=./recordings

# Ring Back Tone (RBT) settings
rbt.enabled=true
